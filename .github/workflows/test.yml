# The provider's tests, and the formatting and lint PartCAD's own repository
# holds itself to. Nothing here asks a store for anything: the tests answer
# every request themselves.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the tools
        run: python -m pip install pytest black isort flake8 Flake8-pyproject
      - name: Lint
        run: |
          black --check --diff .
          isort --check --diff --settings-path pyproject.toml .
          flake8 .
      - name: Test
        run: python -m pytest tests
